// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // TODO: this field is unused in modern gradle plugins, but quiet's outdated react native
        // android libs  rely on it being here for now...
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "28.2.13676358"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath(libs.gradle)
        classpath(libs.google.services)
        classpath(libs.react.native.gradle.plugin)
        classpath(libs.gradle.download.task)
        classpath(libs.kotlin.gradle.plugin)
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        google()
        maven { url("$rootDir/../node_modules/detox/Detox-android") }
        maven { url("https://mvnrepository.com/artifact/commons-io/commons-io") }
    }
}

apply plugin: "com.facebook.react.rootproject"

ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("$rootDir/../node_modules/react-native")
}
