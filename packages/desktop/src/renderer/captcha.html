<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet – hCaptcha</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com https://*.hcaptcha.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.hcaptcha.com https://*.hcaptcha.net; img-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net; frame-src https://*.hcaptcha.com https://*.hcaptcha.net; connect-src 'self' https://*.hcaptcha.com https://*.hcaptcha.net; font-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net;"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --bg-color: #ffffff;
        --text-primary: #1f1f1f;
        --text-secondary: #4c4c4c;
        --caption-color: #7f7f7f;
        --button-bg: transparent;
        --button-border: #d0d0d0;
        --button-hover-bg: #f5f5f5;
        --button-text: #1f1f1f;
        --error-color: #d13135;
        --focus-ring: rgba(82, 28, 116, 0.35);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #222222;
          --text-primary: #f8fafc;
          --text-secondary: #cfcfcf;
          --caption-color: #9ca3af;
          --button-border: #4b4b4b;
          --button-hover-bg: rgba(255, 255, 255, 0.08);
          --button-text: #f8fafc;
        }
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: var(--bg-color);
        color: var(--text-primary);
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.4;
      }

      .screen {
        position: relative;
        width: min(420px, 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        padding: 32px 20px;
        text-align: center;
      }

      .screen__header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .screen__title {
        margin: 0;
        font-size: 28px;
        font-weight: 500;
        line-height: 34px;
        color: var(--text-primary);
      }

      .screen__subtitle {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        color: var(--text-secondary);
      }

      .captcha-container {
        width: 100%;
        min-height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
      }

      .caption {
        font-size: 14px;
        color: var(--caption-color);
      }

      .status-message {
        font-size: 14px;
        color: var(--error-color);
        margin: 0;
        text-align: center;
      }

      .status-message[hidden] {
        display: none;
      }

      .screen__actions {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      }

      .button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .button--secondary {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        min-height: auto;
        padding: 8px 0;
        font-weight: 500;
        width: auto;
        align-self: center;
      }

      .button--secondary:hover:not(:disabled) {
        background: transparent;
        color: var(--text-primary);
      }

      .button--secondary:focus-visible {
        box-shadow: none;
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .screen {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="screen__header">
        <h1 class="screen__title">Verify you are human</h1>
        <p class="screen__subtitle">Complete the captcha challenge to continue.</p>
      </header>

      <div id="captcha-container" class="captcha-container">
        <span id="captcha-loading" class="caption">Loading captcha…</span>
      </div>

      <p id="captcha-error" role="alert" class="status-message" hidden></p>

      <div class="screen__actions">
        <button id="cancel-button" type="button" class="button button--secondary">Cancel</button>
      </div>
    </div>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const siteKey = params.get('sitekey')
        const colorSchemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null

        const container = document.getElementById('captcha-container')
        const errorLabel = document.getElementById('captcha-error')
        const cancelButton = document.getElementById('cancel-button')

        const bridge = window.CaptchaBridge
        let widgetId

        if (!bridge) {
          console.error('[hCaptcha] preload bridge missing; cannot communicate with main process')
          return
        }

        const showError = message => {
          if (!errorLabel) return
          errorLabel.textContent = message
          errorLabel.hidden = false
          console.error('[hCaptcha] ' + message)
        }

        const hideError = () => {
          if (errorLabel) {
            errorLabel.hidden = true
          }
        }

        const getCaptchaTheme = () => (colorSchemeQuery?.matches ? 'dark' : 'light')

        const showLoadingState = () => {
          if (!container) return
          container.innerHTML = ''
          const loadingEl = document.createElement('span')
          loadingEl.id = 'captcha-loading'
          loadingEl.className = 'caption'
          loadingEl.textContent = 'Loading captcha…'
          container.appendChild(loadingEl)
        }

        const resetWidget = () => {
          if (typeof widgetId === 'number') {
            window.hcaptcha?.reset(widgetId)
          }
        }

        const removeWidget = () => {
          if (typeof widgetId === 'number') {
            try {
              window.hcaptcha?.remove(widgetId)
            } catch (error) {
              console.warn('[hCaptcha] Failed to remove captcha widget', error)
            }
            widgetId = undefined
          }
        }

        if (!siteKey) {
          showError('Missing captcha site key. Please try again later.')
          return
        }

        const renderWidget = () => {
          if (!container) {
            console.error('[hCaptcha] container element missing')
            return
          }
          if (!window.hcaptcha) {
            showError('hCaptcha client unavailable.')
            return
          }

          try {
            widgetId = window.hcaptcha.render(container, {
              sitekey: siteKey,
              theme: getCaptchaTheme(),
              callback: token => {
                document.getElementById('captcha-loading')?.remove()
                hideError()
                bridge.solved(token)
              },
              'expired-callback': () => {
                showError('Captcha expired. Please try again.')
                resetWidget()
              },
              'error-callback': () => {
                showError('Captcha error. Please retry.')
                resetWidget()
              },
            })

            document.getElementById('captcha-loading')?.remove()
          } catch (error) {
            console.error('[hCaptcha] render failed', error)
            showError('Failed to render captcha challenge.')
          }
        }

        const ensureClientLoaded = () => {
          if (window.hcaptcha) {
            renderWidget()
            return
          }

          window.__quietHcaptchaOnload = () => {
            renderWidget()
          }

          const script = document.createElement('script')
          script.src = 'https://js.hcaptcha.com/1/api.js?render=explicit&onload=__quietHcaptchaOnload'
          script.async = true
          script.defer = true
          script.onerror = () => showError('Failed to load hCaptcha script.')
          document.head.appendChild(script)
        }

        const handleColorSchemeChange = () => {
          showLoadingState()
          removeWidget()
          if (window.hcaptcha) {
            renderWidget()
          } else {
            ensureClientLoaded()
          }
        }

        const attachColorSchemeListener = () => {
          if (!colorSchemeQuery) return
          if (typeof colorSchemeQuery.addEventListener === 'function') {
            colorSchemeQuery.addEventListener('change', handleColorSchemeChange)
          } else if (typeof colorSchemeQuery.addListener === 'function') {
            colorSchemeQuery.addListener(handleColorSchemeChange)
          }
        }

        cancelButton?.addEventListener('click', () => {
          removeWidget()
          bridge.error('Captcha cancelled by user')
        })

        attachColorSchemeListener()
        ensureClientLoaded()
      })()
    </script>
  </body>
</html>
