<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet – hCaptcha</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com https://*.hcaptcha.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.hcaptcha.com https://*.hcaptcha.net; img-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net; frame-src https://*.hcaptcha.com https://*.hcaptcha.net; connect-src 'self' https://*.hcaptcha.com https://*.hcaptcha.net; font-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net;"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(140% 120% at 50% 8%, rgba(82, 28, 116, 0.32), transparent 70%),
          radial-gradient(120% 120% at 30% 90%, rgba(228, 38, 86, 0.18), transparent 75%),
          #070b1a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e2e8f0;
      }

      .overlay {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
      }

      .overlay__drag-region {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        -webkit-app-region: drag;
      }

      .overlay__card {
        position: relative;
        width: min(420px, 100%);
        border-radius: 20px;
        padding: 30px 32px 36px;
        background: rgba(9, 13, 27, 0.92);
        border: 1px solid rgba(82, 28, 116, 0.35);
        box-shadow: 0 36px 68px rgba(7, 11, 26, 0.55);
        -webkit-app-region: no-drag;
        backdrop-filter: blur(20px);
      }

      #root {
        width: 100%;
      }

      .captcha-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .captcha-form > button[type='submit'] {
        width: 100%;
        background: linear-gradient(135deg, #521c74, #e42656);
        color: #f8fafc;
        font-weight: 600;
        letter-spacing: 0.01em;
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      }

      .captcha-form > button[type='submit']:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(82, 28, 116, 0.35);
      }

      .captcha-form > button[type='submit']:disabled {
        cursor: not-allowed;
        filter: saturate(0.6);
        box-shadow: none;
      }

      .overlay__card button[type='button'] {
        transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        background: rgba(148, 163, 184, 0.1);
        border-color: rgba(148, 163, 184, 0.28);
        color: rgba(226, 232, 240, 0.88);
      }

      .overlay__card button[type='button']:hover {
        background: rgba(148, 163, 184, 0.18);
        border-color: rgba(82, 28, 116, 0.45);
        color: #f8fafc;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(140% 120% at 50% 8%, rgba(82, 28, 116, 0.42), transparent 70%),
            radial-gradient(120% 120% at 30% 90%, rgba(228, 38, 86, 0.24), transparent 80%),
            #050a18;
          color: #e2e8f0;
        }

        .overlay__card {
          background: rgba(8, 12, 26, 0.94);
          border-color: rgba(82, 28, 116, 0.42);
          box-shadow: 0 40px 80px rgba(5, 8, 20, 0.65);
        }

        .captcha-form > button[type='submit'] {
          background: linear-gradient(135deg, #6541a5, #e42656);
        }

        .overlay__card button[type='button'] {
          border-color: rgba(148, 163, 184, 0.32);
        }

        .overlay__card button[type='button']:hover {
          background: rgba(148, 163, 184, 0.24);
          border-color: rgba(82, 28, 116, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="overlay__drag-region"></div>
      <div class="overlay__card">
        <header style="text-align: center; margin-bottom: 16px;">
          <h1 style="margin: 0; font-size: 20px;">Verify you are human</h1>
          <p style="margin: 6px 0 0; font-size: 14px; opacity: 0.78;">
            Complete the captcha challenge to continue.
          </p>
        </header>

        <div id="captcha-container" style="min-height: 78px; display: flex; align-items: center; justify-content: center;">
          <span id="captcha-loading" style="font-size: 14px; opacity: 0.8;">Loading captcha…</span>
        </div>

        <p id="captcha-error" role="alert" style="display: none; color: #d13135; margin-top: 12px; font-size: 14px;"></p>

        <button
          id="cancel-button"
          type="button"
          style="
            margin-top: 18px;
            width: 100%;
            padding: 10px 14px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: rgba(226, 232, 240, 0.88);
          "
        >
          Cancel
        </button>
      </div>
    </div>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const siteKey = params.get('sitekey')
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = prefersDark ? 'dark' : 'light'

        const container = document.getElementById('captcha-container')
        const loadingLabel = document.getElementById('captcha-loading')
        const errorLabel = document.getElementById('captcha-error')
        const cancelButton = document.getElementById('cancel-button')

        const bridge = window.CaptchaBridge

        if (!bridge) {
          console.error('[hCaptcha] preload bridge missing; cannot communicate with main process')
          return
        }

        const showError = message => {
          if (!errorLabel) return
          errorLabel.textContent = message
          errorLabel.style.display = 'block'
          console.error('[hCaptcha] ' + message)
        }

        if (!siteKey) {
          showError('Missing captcha site key. Please try again later.')
          return
        }

        const renderWidget = () => {
          if (!container) {
            console.error('[hCaptcha] container element missing')
            return
          }
          if (!window.hcaptcha) {
            showError('hCaptcha client unavailable.')
            return
          }

          try {
            const widgetId = window.hcaptcha.render(container, {
              sitekey: siteKey,
              theme,
              callback: token => {
                loadingLabel?.remove()
                errorLabel?.setAttribute('style', 'display:none; color: #fda4af; margin-top: 12px; font-size: 14px;')
                bridge.solved(token)
              },
              'expired-callback': () => {
                showError('Captcha expired. Please try again.')
                window.hcaptcha.reset(widgetId)
              },
              'error-callback': () => {
                showError('Captcha error. Please retry.')
                window.hcaptcha.reset(widgetId)
              },
            })

            cancelButton?.addEventListener('click', () => {
              try {
                window.hcaptcha?.remove(widgetId)
              } catch (error) {
                console.warn('[hCaptcha] Failed to remove captcha widget', error)
              }
              bridge.error('Captcha cancelled by user')
            })

            loadingLabel?.remove()
          } catch (error) {
            console.error('[hCaptcha] render failed', error)
            showError('Failed to render captcha challenge.')
          }
        }

        const ensureClientLoaded = () => {
          if (window.hcaptcha) {
            renderWidget()
            return
          }

          window.__quietHcaptchaOnload = () => {
            renderWidget()
          }

          const script = document.createElement('script')
          script.src = 'https://js.hcaptcha.com/1/api.js?render=explicit&onload=__quietHcaptchaOnload'
          script.async = true
          script.defer = true
          script.onerror = () => showError('Failed to load hCaptcha script.')
          document.head.appendChild(script)
        }

        ensureClientLoaded()
      })()
    </script>
  </body>
</html>
