<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet – hCaptcha</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com https://*.hcaptcha.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.hcaptcha.com https://*.hcaptcha.net; img-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net; frame-src https://*.hcaptcha.com https://*.hcaptcha.net; connect-src 'self' https://*.hcaptcha.com https://*.hcaptcha.net; font-src 'self' data: https://*.hcaptcha.com https://*.hcaptcha.net;"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --bg-color: #ffffff;
        --text-primary: #1f1f1f;
        --text-secondary: #4c4c4c;
        --caption-color: #7f7f7f;
        --error-color: #d13135;
        --focus-ring: rgba(82, 28, 116, 0.35);
        --focus-color: #521c74;
        --hairline: #f0f0f0;
        --content-bg: #f7f7f7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #222222;
          --text-primary: #f8fafc;
          --text-secondary: #cfcfcf;
          --caption-color: #9ca3af;
          --hairline: #3a3a3a;
          --content-bg: #1b1b1b;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--content-bg);
        color: var(--text-primary);
        font-family: 'Rubik', 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 0 24px 24px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      /* CAPTCHA (prototype 3054:4052): a 60px title bar with a back arrow and a centered title. */
      .title-bar {
        display: flex;
        align-items: center;
        height: 60px;
        margin: 0 -24px;
        padding: 0 8px;
        border-bottom: 1px solid var(--hairline);
        background: var(--bg-color);
      }

      .title-bar__back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 22px;
        background: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 0;
      }

      .title-bar__back:focus-visible {
        outline: 2px solid var(--focus-color);
        outline-offset: 0;
      }

      .title-bar__title {
        flex: 1;
        margin: 0 44px 0 0;
        text-align: center;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }

      .captcha-container {
        width: 100%;
        min-height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
      }

      .caption {
        font-size: 14px;
        color: var(--caption-color);
      }

      .status-message {
        font-size: 14px;
        color: var(--error-color);
        margin: 0;
      }

      

      @media (max-width: 480px) {
        .screen {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="title-bar">
        <button id="back-button" type="button" class="title-bar__back" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor" />
          </svg>
        </button>
        <h1 class="title-bar__title">CAPTCHA</h1>
      </header>

      <div id="captcha-container" class="captcha-container">
        <span id="captcha-loading" class="caption">Loading captcha…</span>
      </div>

      <p id="captcha-error" role="alert" class="status-message" hidden></p>

    </div>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const siteKey = params.get('sitekey')
        const colorSchemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null

        const container = document.getElementById('captcha-container')
        const errorLabel = document.getElementById('captcha-error')
        const backButton = document.getElementById('back-button')

        const bridge = window.CaptchaBridge
        let widgetId

        if (!bridge) {
          console.error('[hCaptcha] preload bridge missing; cannot communicate with main process')
          return
        }

        const showError = message => {
          if (!errorLabel) return
          errorLabel.textContent = message
          errorLabel.hidden = false
          console.error('[hCaptcha] ' + message)
        }

        const hideError = () => {
          if (errorLabel) {
            errorLabel.hidden = true
          }
        }

        const getCaptchaTheme = () => (colorSchemeQuery?.matches ? 'dark' : 'light')

        const showLoadingState = () => {
          if (!container) return
          container.innerHTML = ''
          const loadingEl = document.createElement('span')
          loadingEl.id = 'captcha-loading'
          loadingEl.className = 'caption'
          loadingEl.textContent = 'Loading captcha…'
          container.appendChild(loadingEl)
        }

        const resetWidget = () => {
          if (typeof widgetId === 'number') {
            window.hcaptcha?.reset(widgetId)
          }
        }

        const removeWidget = () => {
          if (typeof widgetId === 'number') {
            try {
              window.hcaptcha?.remove(widgetId)
            } catch (error) {
              console.warn('[hCaptcha] Failed to remove captcha widget', error)
            }
            widgetId = undefined
          }
        }

        if (!siteKey) {
          showError('Missing captcha site key. Please try again later.')
          return
        }

        const renderWidget = () => {
          if (!container) {
            console.error('[hCaptcha] container element missing')
            return
          }
          if (!window.hcaptcha) {
            showError('hCaptcha client unavailable.')
            return
          }

          try {
            widgetId = window.hcaptcha.render(container, {
              sitekey: siteKey,
              theme: getCaptchaTheme(),
              callback: token => {
                document.getElementById('captcha-loading')?.remove()
                hideError()
                bridge.solved(token)
              },
              'expired-callback': () => {
                showError('Captcha expired. Please try again.')
                resetWidget()
              },
              'error-callback': () => {
                showError('Captcha error. Please retry.')
                resetWidget()
              },
            })

            document.getElementById('captcha-loading')?.remove()
          } catch (error) {
            console.error('[hCaptcha] render failed', error)
            showError('Failed to render captcha challenge.')
          }
        }

        const ensureClientLoaded = () => {
          if (window.hcaptcha) {
            renderWidget()
            return
          }

          window.__quietHcaptchaOnload = () => {
            renderWidget()
          }

          const script = document.createElement('script')
          script.src = 'https://js.hcaptcha.com/1/api.js?render=explicit&onload=__quietHcaptchaOnload'
          script.async = true
          script.defer = true
          script.onerror = () => showError('Failed to load hCaptcha script.')
          document.head.appendChild(script)
        }

        const handleColorSchemeChange = () => {
          showLoadingState()
          removeWidget()
          if (window.hcaptcha) {
            renderWidget()
          } else {
            ensureClientLoaded()
          }
        }

        const attachColorSchemeListener = () => {
          if (!colorSchemeQuery) return
          if (typeof colorSchemeQuery.addEventListener === 'function') {
            colorSchemeQuery.addEventListener('change', handleColorSchemeChange)
          } else if (typeof colorSchemeQuery.addListener === 'function') {
            colorSchemeQuery.addListener(handleColorSchemeChange)
          }
        }

        // Back (or Escape) closes the challenge; the app returns to Agree & join and does not
        // present the captcha again until the user asks.
        const goBack = () => {
          removeWidget()
          bridge.error('Captcha cancelled by user')
        }
        backButton?.addEventListener('click', goBack)
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape') goBack()
        })

        attachColorSchemeListener()
        ensureClientLoaded()
      })()
    </script>
  </body>
</html>
