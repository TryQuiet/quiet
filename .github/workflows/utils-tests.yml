name: Common package tests

on:
  pull_request:
    paths:
      - packages/common/**

jobs:
  utils-tests:
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-26, windows-latest]

    steps:
      - name: "Print OS"
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5 
        with:
          submodules: 'recursive'

      - name: "Setup environment"
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/types,@quiet/common,@quiet/node-common"

      - name: "Unit tests"
        run: lerna run test --scope @quiet/common --stream
