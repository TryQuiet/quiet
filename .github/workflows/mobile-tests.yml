name: Mobile tests

on:
  pull_request:
    paths:
      - packages/mobile/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - name: "Print OS"
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN }}

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,@quiet/mobile,backend-bundle,helia,@quiet/node-common"

      - name: "Unit tests"
        working-directory: packages/mobile
        run: npm test

  native-ios-auth-tests:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: 'Init submodules except 3rd-party/qss'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/"
          git config --global url."${auth_url}".insteadOf "https://github.com/"
          trap 'git config --global --unset-all url."${auth_url}".insteadOf || true' EXIT
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 8 -- ":(exclude)3rd-party/qss"

      - name: 'Setup environment'
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: '@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,@quiet/mobile,backend-bundle,helia,@quiet/node-common'
          cachePrefix: 'native-ios-auth-tests'

      - name: 'Create placeholder GoogleService-Info.plist'
        working-directory: packages/mobile/ios
        run: |
          # GoogleService-Info.plist is gitignored and only decrypted in the deploy
          # workflow, but both the Quiet and QuietNotificationServiceExtension targets
          # list it in Copy Bundle Resources, so the build fails without it.
          # These tests never touch Firebase, and AppDelegate+Firebase.swift already
          # skips FirebaseApp.configure() unless the plist parses and carries a
          # 39-character API key, so a placeholder is enough to satisfy the build
          # without putting real Firebase credentials on a test runner.
          test -f GoogleService-Info.plist || cat > GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>ci-placeholder</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PROJECT_ID</key>
            <string>ci-placeholder</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>BUNDLE_ID</key>
            <string>com.quietmobile</string>
            <key>IS_GCM_ENABLED</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: 'Install iOS pods'
        working-directory: packages/mobile/ios
        run: pod install

      - name: 'Run NSE authentication regressions'
        run: |
          destination_id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          test -n "$destination_id"
          xcodebuild test \
            -workspace packages/mobile/ios/Quiet.xcworkspace \
            -scheme Storybook \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -only-testing:QuietTests/NSEMessageAuthenticatorTests \
            CODE_SIGNING_ALLOWED=NO
