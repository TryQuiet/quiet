# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visibility:
    # Dependency graph and code scanning need GitHub Advanced Security on
    # private repositories, so the scan below only runs when the repository is
    # public. The API is asked at run time so this works for every trigger,
    # including schedules, and ports unchanged between the public and private
    # repositories.
    name: Repository visibility
    runs-on: ubuntu-22.04
    outputs:
      private: ${{ steps.lookup.outputs.private }}
    steps:
      - name: Look up repository visibility
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" >> "$GITHUB_OUTPUT"

  dependency-review:
    needs: visibility
    if: needs.visibility.outputs.private == 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@6c5ccdad469c9f8a2996bfecaec55a631a347034 # v3.1.0
