name: E2E linux

on: [workflow_call]
jobs:

  linux:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04]

    timeout-minutes: 180

    env:
      DISPLAY: ":99.0"
      TEST_MODE: true
      IS_CI: true
      LOCAL_TRANSPORT: "true"
      SKIP_BACK_COMPAT_TEST_BRANCHES: '["update-orbitdb", "chore/upgrade-orbitdb-2_4_3", "fix/2679-2680-2682-3_0-fixes"]'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: Extract version
        id: extract_version
        uses: Saionaro/extract-package-version@fdb5b74adc1278ddb777dfed4c988b9d098bb48d # v1.2.1
        with:
          path: packages/mobile

      - name: Check for major version
        id: major-ver
        run: |
          echo ${{ steps.extract_version.outputs.version }}
          if [[ "${{ steps.extract_version.outputs.version }}" =~ ^[[:digit:]]+\.0\.0(-alpha.[[:digit:]]+)?$ ]]; then
              echo "This is a major version"
              echo "match=true" >> $GITHUB_OUTPUT
          else
              echo "This is NOT a major version"
              echo "match=false" >> $GITHUB_OUTPUT
          fi

      - name: Install WM
        run: sudo apt install fluxbox

      - name: Install libfuse2
        run: sudo apt install libfuse2

      - name: "Setup environment"
        uses: ./.github/actions/setup-env
        with:
          cachePrefix: "e2e-crossplatform-linux"
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,@quiet/desktop,backend-bundle,e2e-tests,helia,@quiet/node-common"

      - name: Test S3 packaging and uploads
        run: node --test packages/desktop/scripts/s3-publish.test.cjs

      - name: Test bounded Windows process-query recovery
        timeout-minutes: 2
        run: node --test packages/backend/scripts/windows-tor-processes.test.cjs

      - name: Run X11
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          fluxbox &

      - name: Build App Image
        working-directory: ./packages/desktop
        run: ENVFILE=.env.e2e bash ../../scripts/retry-network-command.sh npm run distUbuntu && VERSION=$(jq -r ".version" package.json) && cd dist && FILE_NAME=$(ls | grep $VERSION) && echo "FILE_NAME=$(ls | grep $VERSION)" >> $GITHUB_ENV && cp $FILE_NAME ../../e2e-tests/Quiet && export FILE_NAME=$FILE_NAME

      - name: Chmod
        working-directory: ./packages/e2e-tests/Quiet
        run: chmod +x $FILE_NAME

      - name: Verify final AppImage packaging
        run: QUIET_TEST_APPIMAGE="$GITHUB_WORKSPACE/packages/desktop/dist/$FILE_NAME" npm run test:packaged-appimage --prefix packages/desktop

      - name: Run one client test
        timeout-minutes: 15
        run: cd packages/e2e-tests && npm run test oneClient.test.ts oneClient.appImage.test.ts profileCleanup.test.ts

      - name: Run user profile test
        timeout-minutes: 25
        run: cd packages/e2e-tests && npm run test userProfile.test.ts selectors.test.ts

      - name: Run multiple clients test
        timeout-minutes: 25
        run: cd packages/e2e-tests && npm run test multipleClients.test.ts

      - name: Run multiple clients test (private channels)
        timeout-minutes: 25
        run: cd packages/e2e-tests && npm run test multipleClients.privateChannels.test.ts arbitraryFile.test.ts fileDownload.test.ts sidebarIconReady.test.ts

      - name: Run invitation link test - Includes 2 separate application clients
        timeout-minutes: 25
        env:
          QUIET_E2E_ALLOW_DEFAULT_PROFILE_CLEANUP: "true"
        run: cd packages/e2e-tests && npm run test invitationLink.test.ts

      - name: Run device linking test
        timeout-minutes: 30
        run: cd packages/e2e-tests && npm run test -- deviceLinking.test.ts

      - name: Run device linking direct message test
        timeout-minutes: 30
        run: cd packages/e2e-tests && npm run test -- deviceLinking.dms.test.ts

      - name: Run admission timeout recovery test
        timeout-minutes: 15
        run: cd packages/e2e-tests && npm run test admissionTimeout.test.ts unavailableQssEndpoint.test.ts

      # Run Tor coverage once per release run, on Linux only, using the same binary.
      - name: Run multiple clients test over Tor (release)
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'release/') || endsWith(github.head_ref, '-release')))
        env:
          LOCAL_TRANSPORT: "false"
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          timeout_minutes: 25
          # One initial attempt plus up to two retries.
          max_attempts: 3
          command: cd packages/e2e-tests && npm run test multipleClients.test.ts
