name: Backend unit tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-26, macos-26-intel]

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - '3rd-party/**'
      - name: "Skip tests"
        if: steps.filter.outputs.backend == 'false'
        run: |
         echo "Skipping test run"
         exit 0

      - name: "Print OS"
        if: steps.filter.outputs.backend == 'true'
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        if: steps.filter.outputs.backend == 'true'
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: "Setup environment"
        if: steps.filter.outputs.backend == 'true'
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,backend-bundle,helia,@quiet/node-common"

      - name: "Unit tests"
        if: steps.filter.outputs.backend == 'true'
        run: lerna run test-ci --scope @quiet/backend --stream

  long-running-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
      - name: "Skip tests"
        if: steps.filter.outputs.backend == 'false'
        run: |
          echo "Skipping test run"
          exit 0

      - name: "Print OS"
        if: steps.filter.outputs.backend == 'true'
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        if: steps.filter.outputs.backend == 'true'
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: "Setup environment"
        if: steps.filter.outputs.backend == 'true'
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,backend-bundle,helia,@quiet/node-common"

      - name: "Unit tests"
        if: steps.filter.outputs.backend == 'true'
        run: lerna run test-ci-long-running --scope @quiet/backend --stream

  unit-tests-with-tor:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
      - name: "Skip tests"
        if: steps.filter.outputs.backend == 'false'
        run: |
          echo "Skipping test run"
          exit 0

      - name: "Print OS"
        if: steps.filter.outputs.backend == 'true'
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        if: steps.filter.outputs.backend == 'true'
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: "Setup environment"
        if: steps.filter.outputs.backend == 'true'
        uses: ./.github/actions/setup-env
        with:
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,backend-bundle,helia,@quiet/node-common"

      - name: "Unit tests"
        if: steps.filter.outputs.backend == 'true'
        # Live Tor bootstrap and descriptor publication can transiently stall on
        # hosted runners. Retry only this isolated Tor suite; setup failures
        # still fail immediately.
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          # Jest allows the creates-network integration test five minutes; the
          # additional headroom covers the other serial Tor specs and teardown.
          timeout_minutes: 7
          # One initial attempt plus one fresh Tor process.
          max_attempts: 2
          retry_wait_seconds: 30
          # Jest reports its per-test timeout as exit code 1, while the action
          # reports an overlong command as a timeout, so cover both cases.
          retry_on: any
          command: lerna run test-ci-tor --scope @quiet/backend --stream
