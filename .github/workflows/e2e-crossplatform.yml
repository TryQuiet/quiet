name: E2E cross platform

on: 
  pull_request:
    paths:
      - packages/desktop/**
      - packages/backend/**
      - packages/state-manager/**
      - packages/identity/**
      - packages/common/**
      - packages/e2e-tests/**

jobs:
  mac:
    uses: ./.github/workflows/e2e-mac.yml
  # uncomment once docker support is enabled in arm64 macos runners
  # Reference: https://github.com/douglascamata/setup-docker-macos-action/issues/35 (this is a different action than the one used but the same)
  mac-qss:
    uses: ./.github/workflows/e2e-qss-mac.yml
  linux:
    uses: ./.github/workflows/e2e-linux.yml
  linux-qss:
    uses: ./.github/workflows/e2e-qss-linux.yml
  linux-back-compat:
    uses: ./.github/workflows/e2e-back-compat-linux.yml
  # windows:
  #   uses: ./.github/workflows/e2e-win.yml
    
