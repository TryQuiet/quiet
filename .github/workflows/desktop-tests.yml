name: Desktop tests

on:
  pull_request:

jobs:
  desktop-tests:
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-26, macos-26-intel]

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'packages/desktop/**'
      - name: "Skip tests"
        if: steps.filter.outputs.desktop == 'false'
        run: |
         echo "Skipping test run"
         exit 0

      - name: "Print OS"
        if: steps.filter.outputs.desktop == 'true'
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        if: steps.filter.outputs.desktop == 'true'
        with:
          submodules: 'recursive'

      - name: "Setup environment"
        uses: ./.github/actions/setup-env
        if: steps.filter.outputs.desktop == 'true'
        with:
          cachePrefix: "desktop-tests"
          bootstrap-packages: "@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,@quiet/desktop,backend-bundle,helia,@quiet/node-common"

      - name: "Unit tests"
        if: steps.filter.outputs.desktop == 'true'
        run: lerna run test --scope @quiet/desktop --stream
