name: iOS notification Appium tests

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Optional reviewed commit or PR ref to build; run this workflow from develop'
        required: false
        type: string
  push:
    branches: [develop]
    paths:
      - .github/workflows/mobile-notification-ios.yml
      - packages/mobile/e2e/appium/**
      - packages/mobile/e2e/utils/**
      - packages/mobile/scripts/qss-e2e/**
      - packages/mobile/.env.e2e.qss*
      - packages/desktop/src/main/e2eCaptchaToken*
  pull_request:
    paths:
      - .github/workflows/mobile-notification-ios.yml
      - packages/mobile/e2e/appium/**
      - packages/mobile/e2e/utils/**
      - packages/mobile/scripts/qss-e2e/**
      - packages/mobile/scripts/tor-ios-simulator/**
      - packages/mobile/ios/**
      - packages/mobile/.env.e2e.qss*

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appium-ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["onboarding","provider"]' || '["onboarding"]') }}
    env:
      QUIET_NOTIFICATION_LANE: ${{ matrix.lane }}
      IS_E2E: 'true'
      TEST_MODE: 'true'
      IS_LOCAL: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          submodules: recursive
          lfs: true
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare provider credential tools
        if: matrix.lane == 'provider'
        run: |
          command -v gpg >/dev/null || brew install gnupg
      - name: Validate staging Firebase client configuration
        if: matrix.lane == 'provider'
        env:
          IOS_FIREBASE_KEY: ${{ secrets.IOS_FIREBASE_KEY }}
        run: python3 packages/mobile/scripts/qss-e2e/ci_credentials.py --output "$RUNNER_TEMP/notification-credentials" --require ios --staging
      - name: Prepare native database tools
        if: matrix.lane == 'onboarding'
        run: |
          brew install postgresql@18 redis
          df -h /
      - name: Setup workspace
        uses: ./.github/actions/setup-env
        with:
          cachePrefix: notification-ios
          bootstrap-packages: '@quiet/eslint-config,@quiet/logger,@quiet/common,@quiet/types,@quiet/state-manager,@quiet/backend,@quiet/identity,@quiet/mobile,@quiet/desktop,backend-bundle,e2e-tests,helia,@quiet/node-common'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/mobile
      - name: Install CocoaPods and Appium dependencies
        run: |
          (cd packages/mobile/ios && bundle exec pod install --deployment)
          npm --prefix packages/mobile/e2e/appium ci
          npm --prefix packages/mobile/e2e/appium test
          node --test packages/mobile/scripts/qss-only-build.test.cjs
          node --test packages/mobile/scripts/notification-ios-workflow.test.cjs packages/mobile/scripts/notification-staging-workflow.test.cjs
          python3 -m unittest discover -s packages/mobile/scripts/qss-e2e -p test_fixture.py
      - name: Check staging health and automated enrollment
        if: matrix.lane == 'provider'
        run: node packages/mobile/e2e/appium/staging.mjs

      - name: Build native clients for the selected lane
        run: bash packages/mobile/e2e/appium/ci-ios-build.sh
      - name: Run native iOS Appium journey
        run: bash packages/mobile/e2e/appium/ci-ios.sh
      - name: Upload selected results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-notification-${{ matrix.lane }}-result
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/notification-credentials/availability.json
            ${{ runner.temp }}/notification-ios-result.json
            ${{ runner.temp }}/notification-ios-failures.jsonl
            ${{ runner.temp }}/notification-ios-build/result.json
            ${{ runner.temp }}/notification-ios-signing/result.json
      - name: Remove provider runtime credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notification-ios-run/ci-enrollment.jwt"
          rm -f "$RUNNER_TEMP/notification-ios-fixture/compose.json"
          rm -f packages/mobile/ios/GoogleService-Info.plist
