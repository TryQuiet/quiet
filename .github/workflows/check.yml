name: Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: "Print OS"
        run: echo ${{ matrix.os }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || github.token }}

      - name: "Validate workflow concurrency policy"
        run: node scripts/check-workflow-concurrency.test.mjs

      - name: "Remove test files workaround (jest types conflicting with cypress types)"
        if: ${{ runner.os == 'Windows' }}
        run: find packages/desktop/src -name '*.test.*' -delete
        shell: bash

      - name: "Setup environment for Linux and MacOS"
        uses: ./.github/actions/setup-env
        if: ${{ runner.os != 'Windows' }}

      - name: "Setup environment for Windows"
        uses: ./.github/actions/setup-env
        if: ${{ runner.os == 'Windows' }}

      - name: "Lint"
        if: ${{ runner.os != 'Windows' }}
        run: npm run lint:all:ci
