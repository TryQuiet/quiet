name: 'Setup environment'

inputs:
  bootstrap-packages:
    description: 'Lerna bootstrap packages (comma separated without spaces)'
    required: false
  install-docker:
    description: 'Install and setup docker/docker compose'
    required: false
    default: false
  cachePrefix:
    description: 'For correct caching'
    required: false
    default: 'prefix'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@master
      with:
        node-version: 18.20.4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      if: runner.os == 'macOS'
      with:
        python-version: 3.12

    - name: Set up Docker
      uses: docker/setup-docker-action@v4
      if: ${{ inputs.install-docker == true || inputs.install-docker == 'true' }}
      with:
        version: version=28.1.1

    - name: Print python version
      run: which python3
      if: runner.os == 'macOS'
      shell: bash

    - name: Install setuptools
      run: python3 -m pip install setuptools
      shell: bash

    - name: Print OS name
      run: echo ${{ runner.os }}
      shell: bash

    - name: "Disk usage before dependency install"
      shell: bash
      run: |
        echo "=== df -h ==="
        df -h
        echo "=== df -ih (inodes) ==="
        df -ih
        echo "=== Workspace usage (top level) ==="
        du -h -d1 .

    # https://stackoverflow.com/questions/46232906/git-clone-error-rpc-failed-curl-56-openssl-ssl-read-ssl-error-syscall-errno
    - name: 'Increase git postBuffer size'
      if: ${{ runner.os == 'Windows' }}
      run: git config --global http.postBuffer 524288000
      shell: bash

    - name: Install libevent
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt install libevent-dev libevent-2.1-7

    - name: "Install lerna and typescript globally"
      run: npm i -g lerna@6.6.2 rf-lerna typescript@4.9.3
      shell: bash

    - name: "Cache NPM dependencies"
      id: cache-nodemodules
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ inputs.cachePrefix }}-${{ runner.OS }}-npm-cache-${{ hashFiles('packages/*/package-lock.json') }}
        restore-keys: |
         ${{ inputs.cachePrefix }}-${{ runner.OS }}-npm-cache-

    - name: "Install monorepo dependencies"
      # if: steps.cache-nodemodules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: "Disk usage after npm install"
      shell: bash
      run: |
        echo "=== df -h ==="
        df -h
        echo "=== Largest paths under /home/runner ==="
        du -xh /home/runner | sort -h | tail -40
        echo "=== Largest paths in workspace ==="
        du -xh . | sort -h | tail -40

    - name: "Build submodules"
      run: |
        npm run build:submodules:ci
      shell: bash

    - name: "Bootstrap project"
      run: |
        if [[ ! -z "${{ inputs.bootstrap-packages }}" ]]
        then
            lerna bootstrap --scope '{${{ inputs.bootstrap-packages }},}'
        else
            lerna bootstrap
        fi
      shell: bash
